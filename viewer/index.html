<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR report</title>
    <!-- The "review" icon from lib/favicon.ts, shown until the page sets the icon for its status. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath transform='translate(8 8) scale(2)' d='M20 14.5a2 2 0 0 1-2 2H8l-4 3.5V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z' fill='none' stroke='white' stroke-width='2.6' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // The saved theme (see lib/state.tsx), applied before the first paint so a dark page never starts white.
      (() => {
        let saved = "system";
        try {
          saved = JSON.parse(localStorage.getItem("pr-report:theme") ?? '"system"');
        } catch {}
        const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : system;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script id="pr-report-data" type="application/json">__PR_REPORT_DATA__</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
